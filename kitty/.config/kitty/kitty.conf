# ╔══════════════════════════════════════════════════════════╗
# ║                          Kitty                           ║
# ╚══════════════════════════════════════════════════════════╝

# ┌──────────────────────────────────────────────────────────┐
# │                        Appearance                        │
# └──────────────────────────────────────────────────────────┘

# ═══════════════════════════ Font ═══════════════════════════

font_size 16.0
disable_ligatures never

font_family      family="SF Mono"                   style="Regular"
bold_font        family="SF Mono"                   style="Bold"
italic_font      family="VictorMono Nerd Font Mono" style="Medium Italic"
bold_italic_font family="SF Mono"                   style="Regular Italic"

# ┄┄┄ font_features
# modify_font cell_width 100%
# modify_font baseline 0
modify_font cell_height 3px
modify_font underline_thickness 200%
modify_font underline_position 0
modify_font strikethrough_thickness 100%
modify_font strikethrough_position 2px

# values: (thin|thick)-(sparse|dense)
undercurl_style thin-sparse
text_composition_strategy platform


# ══════════════════════════ Cursor ══════════════════════════

cursor none
cursor_text_color background
cursor_shape block
cursor_blink_interval 0
cursor_trail 5

# For keeping the cursor shape
shell_integration no-cursor

scrollbar scrolled-or-hovered


# ══════════════════════════ Colors ══════════════════════════

background_opacity 0.95
background_blur    64

background_image Elaina.png
background_image_layout cscaled
background_tint 0.988

foreground #B8C0FF
background #151518

selection_foreground #000000
selection_background #B0B0FF

color0  #282325
color8  #8A90C8
color1  #FF757F
color9  #FF8D94
color2  #9ECE6A
color10 #9fe044
color3  #FFC777
color11 #FFD8AB
color4  #82AAFF
color12 #9AB8FF
color5  #C099FF
color13 #9999FF
color6  #7DCFFF
color14 #A4DAFF
color7  #A9B8E8
color15 #C8D3F5


# ════════════════════ Window and Tab Bar ════════════════════

hide_window_decorations titlebar-only
macos_traditional_fullscreen no
confirm_os_window_close -1
# macos_quit_when_last_window_closed yes

tab_bar_edge top
tab_bar_style slant
tab_bar_min_tabs 1
tab_title_max_length 50

active_tab_background   #82AAFF
active_tab_foreground   #1E2030
inactive_tab_background #2F334D
inactive_tab_foreground #758AAE


# ┌──────────────────────────────────────────────────────────┐
# │                         Behavior                         │
# └──────────────────────────────────────────────────────────┘

# ══════════════════════════ Mouse ═══════════════════════════

mouse_hide_wait 0

# values: none|straight|double|curly|dotted|dashed
url_style curly
url_color #4FD6BE
detect_urls yes
show_hyperlink_targets yes
hyperlink_target_position tooltip

# values: always|never|smart
strip_trailing_spaces smart

clear_all_mouse_actions yes
mouse_map cmd+left         click       grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map left             press       ungrabbed         mouse_selection normal
mouse_map option+left      press       grabbed,ungrabbed mouse_selection normal
mouse_map ctrl+option+left press       grabbed,ungrabbed mouse_selection rectangle
mouse_map left             doublepress ungrabbed         mouse_selection word
mouse_map left             triplepress ungrabbed         mouse_selection line
mouse_map option+left      doublepress grabbed,ungrabbed mouse_selection word
mouse_map option+left      triplepress grabbed,ungrabbed mouse_selection line


# ═══════════════════════════ Misc ═══════════════════════════

notify_on_cmd_finish unfocused 10.0 notify
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ─── Remote Control ─────────────────────────────────────────
# Lets nvim over ssh open web links on this Mac, and nothing else; see rc_open_url_only.py.
remote_control_password "" rc_open_url_only.py
allow_remote_control socket


# ─── Scrollback Pager ───────────────────────────────────────
env read_from_shell=PATH
scrollback_pager zsh -lic "nvim --cmd 'let g:fvim_kitty_scrollback = 1' -"
# NOTE: A longer history, only for the pager (about 10,000 lines per MB); scrolling in the window keeps its own.
scrollback_pager_history_size 10


# ┌──────────────────────────────────────────────────────────┐
# │                         Keyboard                         │
# └──────────────────────────────────────────────────────────┘

macos_option_as_alt yes
clear_all_shortcuts yes

# ┄┄┄ Copy and Paste
map cmd+c             copy_to_clipboard
map cmd+v             paste_from_clipboard
map ctrl+insert       copy_to_clipboard
map ctrl+shift+insert paste_from_clipboard

# ┄┄┄ Window
map cmd+n      new_os_window
map cmd+t      new_tab
map cmd+w      close_tab
map cmd+ctrl+w quit
map cmd+h      hide_macos_app
map cmd+opt+h  hide_macos_other_apps
map cmd+m      minimize_macos_window
map ctrl+cmd+f toggle_fullscreen

# ┄┄┄ Tab
map cmd+opt+right move_tab_forward
map cmd+opt+left  move_tab_backward
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+[ previous_tab
map cmd+] next_tab

# ┄┄┄ Edit
# Move the cursor to the line's start or end.
map cmd+left  send_text all \x01
map cmd+right send_text all \x05

# ┄┄┄ Zoom
map cmd+equal change_font_size all +0.5
map cmd+minus change_font_size all -0.5
map cmd+0     change_font_size all 0

# ┄┄┄ Search and Jump
map cmd+f    show_scrollback
map cmd+up   scroll_to_prompt -1
map cmd+down scroll_to_prompt 1

# ┄┄┄ Config
map cmd+,       edit_config_file
map ctrl+cmd+,  load_config_file
map opt+cmd+,   debug_config
map cmd+shift+p command_palette

# ┄┄┄ Editor
editor zsh -lic "$EDITOR $0"
map --when-focus-on var:in_editor cmd+v
map --when-focus-on var:in_editor ctrl+cmd+v paste_from_clipboard


# ┌──────────────────────────────────────────────────────────┐
# │                        Pane Mode                         │
# └──────────────────────────────────────────────────────────┘

enabled_layouts splits,stack
inactive_border_color #2F334D

# NOTE: ctrl+s enters a tmux-like pane mode, shown in orange: for the next key if tapped, until released if held.
geninclude pane_mode.py

# NOTE: The default title, plus `Z` on a zoomed tab (tmux's mark) and the mode's name on the active tab while it is on.
tab_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{'Z ' if layout_name == 'stack' and num_windows > 1 else ''}{tab.last_focused_progress_percent}{title}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{('[' + keyboard_mode + '] ') if keyboard_mode else ''}{'Z ' if layout_name == 'stack' and num_windows > 1 else ''}{tab.last_focused_progress_percent}{title}"
